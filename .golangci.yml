# golangci-lint 配置（v2 格式）。
#
# 取舍原则：只开「能抓到真问题」的检查项，不开纯风格强制项（lll / wsl / varnamelen /
# exhaustruct 之类）。一个开了却长期要靠 nolint 压制的检查项，等于没有检查项——
# 它只会训练人忽略 CI 输出。
version: "2"

run:
  timeout: 5m
  # 相对路径按 go.mod 所在目录解析，保证本地与 CI 输出一致
  relative-path-mode: gomod
  # smoke 测试依赖真实浏览器，交给独立的 smoke job 跑，这里不带上 smoke tag
  tests: true

linters:
  # standard = errcheck + govet + ineffassign + staticcheck + unused
  default: standard
  enable:
    # —— 并发与资源 ——
    - bodyclose # HTTP 响应体必须关闭：Session 里漏一处就是连接泄漏
    - noctx # 出站 HTTP 请求必须带 context，否则无法取消
    - copyloopvar # 循环变量捕获：并发闭包里的经典坑
    - durationcheck # time.Duration 相乘的隐含 bug
    - wastedassign # 赋值后从未被读走
    - prealloc # 已知长度的切片应预分配
    # —— 错误处理 ——
    - errorlint # errors.Is / errors.As / %w 的正确用法
    - errname # 错误变量命名（ErrXxx / XxxError）
    - nilerr # 返回 nil 却同时说明有错
    - nolintlint # 不允许裸 nolint，必须写明原因
    # —— 安全与正确性 ——
    - gosec # 危险调用（弱随机、路径拼接、不安全 TLS）
    - gocritic # 覆盖大量常见写法问题
    - unconvert # 无意义的类型转换
    - unparam # 永远同一个值的参数
    - predeclared # 遮蔽内建标识符
    - usestdlibvars # 该用标准库常量却写了字面量
    - modernize # 可用新版语言/标准库简化之处
    # —— 可读性 ——
    - misspell # 英文注释/字符串拼写
    - revive # golint 的超集：导出符号必须有文档注释
    - whitespace # 多余空行

  settings:
    govet:
      # shadow 会报出大量「合理遮蔽」，价值低于噪音，关掉
      disable:
        - shadow
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
        - name: package-comments
        - name: blank-imports
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: indent-error-flow
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
    gocritic:
      # 关掉「性能微优化」与「风格偏好」类检查，只留能指出逻辑问题的
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
    gosec:
      excludes:
        # 本库会用 exec 启动用户指定的 Chrome 路径，是设计意图而非漏洞
        - G204
        # 文件权限按 Chrome 自身需要设置，不强制收窄
        - G306
        - G302
    staticcheck:
      checks:
        - all
        # 未使用参数在接口实现/回调签名里很常见，交由 revive 的 unused-parameter 统一管
        - -ST1000
        - -ST1003
        - -ST1016
    misspell:
      locale: US

  exclusions:
    generated: strict
    presets:
      - comments
      # 忽略 Close/Fprintf/Sprintf 之类「业界惯例可不检查」的错误
      - std-error-handling
      - common-false-positives
    rules:
      # 测试代码不受这些约束：表驱动用例需要重复结构，断言里的 gosec 误报也多半在测试里。
      # unused-parameter 一并放行——http.HandlerFunc / t.Cleanup 这类固定签名里
      # 用不到某个参数是常态，改名成 _ 只是噪音。
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - unparam
          - prealloc
          - dupl
          - revive
      # 示例程序是给人读的，允许直接 fmt.Println、硬编码 URL，
      # 也允许 log.Fatal 跳过 defer（进程马上结束，清理不清理无所谓）。
      - path: ^example/
        linters:
          - gosec
          - errcheck
          - unparam
          - prealloc
          - gocritic
      # 调试入口同理
      - path: ^cmd/
        linters:
          - gosec
          - unparam
          - gocritic

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: strict

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  # 新代码有问题就失败；历史遗留交给下面这行显式关闭
  new: false
